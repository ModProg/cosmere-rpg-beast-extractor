<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width">
		<title>Beast Extractor</title>
		<link data-trunk rel="rust" data-bin="web" data-cargo-features="bin-web">
		<link data-trunk rel="copy-dir" href="./obsidian-fantasy-statblocks">
		<link data-trunk rel="css" href="./assets/simple.css">
		<link data-trunk rel="css" href="./assets/custom.css">
	</head>
	<body>
		<form id="form">
			<p>See <a href="https://github.com/ModProg/cosmere-rpg-beast-extractor">the GitHub repo</a>
				for documentation. This works completely locally and does not upload anything to a server.</p>
			<p>The <em>Obsidian Frontmatter</em>
				format can be used with <a href="https://plugins.javalent.com/statblocks">Fantasy Statblocks</a>
				when combined with this custom <a href="obsidian-fantasy-statblocks/Layout.json" download="Stormlight Archive Layout.json">layout</a>
				and <a href="obsidian-fantasy-statblocks/Style.css" download="Stormlight Archive Style.css">style</a>
				(<a href=https://github.com/ModProg/cosmere-rpg-beast-extractor/tree/main/obsidian-fantasy-statblocks>How to Install</a>)</p>
			<label>
				File to extract<br>
				<input type="file" name="file" id="file" required accept=".pdf,application/pdf">
			</label>
			<label>
				Pages to extract<br>
				<select aria-label="set predefined page range" autocomplete="off" id="predefined-page-ranges">
					<option value="stormlight-worldguide">Stormlight Worldguide</option>
					<option value="stonewalkers">Stonewalkers</option>
					<option hidden disabled selected value>Select predefined page range</option>
				</select>
				<input name="pages" id="pages" required>
			</label>
			<div style="display: flex; flex-direction: row; gap: 1em;">
				<label>
					Parser<br>
					<select id="parser" required>
						<option value="manual">Manual</option>
					</select>
					<br>
				</label>
				<label>
					Preview Page<br>
					<select id="preview-page"></select>
				</label>
			</div>
			<div id="editor" data-wide>
				<textarea id="parser-input" rows="20" readonly></textarea>
				<textarea id="parser-grammar" rows="20"></textarea>
				<div id="parser-output">
				</div>
			</div>
			<label>
				Format<br>
				<select id="format" required>
					<option value="raw">Raw</option>
					<option value="yaml" selected>YAML</option>
					<option value="obsidian-frontmatter">Obsidian Frontmatter (.md)</option>
				</select>
			</label>
			<div>
				<input type="reset">
				<button id="confirm">
					Parse Beasts
				</button>
			</div>
		</form>
		<div id="loading" data-disabled>
			<span class="loader"></span>
		</div>
	</body>
</html>
