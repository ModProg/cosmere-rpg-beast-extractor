<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width">
		<title>Beast Extractor</title>

		<!-- <link data-trunk rel="scss" href="./assets/custom.scss"> -->
		<link rel="stylesheet" href="src/simple.css">
		<link rel="stylesheet" href="src/custom.scss">
		<script src="src/main.ts" type="module"></script>
		<!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/6.65.7/codemirror.min.js" integrity="sha512-8RnEqURPUc5aqFEN04aQEiPlSAdE0jlFS/9iGgUyNtwFnSKCXhmB6ZTNl7LnDtDWKabJIASzXrzD0K+LYexU9g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script> -->

	</head>
	<body>
		<form id="form" style="display: none">
			<p>See <a href="https://github.com/ModProg/cosmere-rpg-beast-extractor">the GitHub repo</a>
				for documentation. This works completely locally and does not upload anything to a server.</p>
			<p>The <em>Obsidian Frontmatter</em>
				format can be used with <a href="https://plugins.javalent.com/statblocks">Fantasy Statblocks</a>
				when combined with this custom <a href="obsidian-fantasy-statblocks/Layout.json" download="Stormlight Archive Layout.json">layout</a>
				and <a href="obsidian-fantasy-statblocks/Style.css" download="Stormlight Archive Style.css">style</a>
				(<a href=https://github.com/ModProg/cosmere-rpg-beast-extractor/tree/main/obsidian-fantasy-statblocks>How to Install</a>)</p>
			<label>
				File to extract<br>
				<input type="file" name="file" id="file" required accept=".pdf,application/pdf">
			</label>
			<label>
				Pages to extract<br>
				<select aria-label="set predefined page range" autocomplete="off" id="predefined-page-ranges">
					<option value="stormlight-worldguide">Stormlight Worldguide</option>
					<option value="stonewalkers">Stonewalkers</option>
					<option hidden disabled selected value>Select predefined page range</option>
				</select>
				<input name="pages" id="pages" required>
			</label>
			<div style="display: flex; flex-direction: row; gap: 1em;">
				<label>
					Parser<br>
					<select id="parser" required autocomplete="on">
						<option value="manual">Manual</option>
						<option value="beast">Beast / Adversary</option>
					</select>
					<br>
				</label>
				<label class="editor-options">
					Preview Page<br>
					<select id="preview-page"></select>
				</label>
				<label class="editor-options">
					Editor Style<br>
					<select id="editor-style">
						<option value="vertical">Vertical</option>
						<option value="side-by-side">Side by Side</option>
					</select>
				</label>
				<label class="editor-options">
					Data Mapping<br>
					<select id="data-mapping">
						<option value="none">None</option>
						<option value="jsonata">JSONata</option>
					</select>
				</label>
			</div>
			<div id="editor" class="wide" style="display: none">
				<div class="row">
					<textarea id="parser-input" rows="20" readonly></textarea>
					<textarea id="parser-grammar" rows="20"></textarea>
					<div id="parser-output" class="output"></div>
				</div>
				<div id="editor-mapping" class="row">
					<textarea id="mapping-code" rows="20" readonly>$</textarea>
					<div id="mapping-output" class="output"></div>
				</div>
			</div>
			<label>
				Format<br>
				<select id="format" required>
					<option value="raw">Raw</option>
					<option value="yaml" selected>YAML</option>
					<option value="obsidian-frontmatter">Obsidian Frontmatter (.md)</option>
				</select>
			</label>
			<div>
				<input type="reset">
				<button id="confirm">
					Parse Beasts
				</button>
			</div>
		</form>
		<div id="loading" data-disabled>
			<span class="loader"></span>
		</div>
	</body>
</html>
